const d=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
async function open_(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},k,d(C)))}
function show(h){document.open();document.write(h);document.close()}
async function go(p,save){try{const h=await open_(p);if(save)try{localStorage.setItem('kp',p)}catch(e){}show(h)}catch(e){document.getElementById('e').textContent='合言葉がちがうみたい'}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value,true)};
try{const s=localStorage.getItem('kp');if(s)go(s,false)}catch(e){}
